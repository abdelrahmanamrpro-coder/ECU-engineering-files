<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECU Engineering Files 26/27</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#e8f1fb;--bg2:#cfe0f4;--line:#9db9d9;--ink:#0d2540;--mut:#4f6a88;--card:#fbfdff;--edge:#9bb5d3;--acc:#d97f00;--acc2:#0a7bc4;--fold:#f2a900;--fold2:#c78500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#071526;--bg2:#0d2a47;--line:#1f4a78;--ink:#e6f1ff;--mut:#8fb0d3;--card:#102e4d;--edge:#061220;--acc:#ffb703;--acc2:#4cc9f0}}
:root[data-theme="dark"]{--bg1:#071526;--bg2:#0d2a47;--line:#1f4a78;--ink:#e6f1ff;--mut:#8fb0d3;--card:#102e4d;--edge:#061220;--acc:#ffb703;--acc2:#4cc9f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:60vh;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;opacity:.55;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.scene{width:46px;height:46px;perspective:300px;margin:6px 10px 6px 4px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:20px;border:2px solid var(--acc);color:var(--acc);background:color-mix(in srgb,var(--card) 75%,transparent)}
.cube i:nth-child(1){transform:translateZ(23px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(23px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(23px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(23px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(23px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(23px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-20deg) rotateY(30deg)}}
h1{margin:0;font-size:24px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:13px}
.sp{flex:1}
#q{width:240px;max-width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
#q:focus{outline:none;border-color:var(--acc2)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
#crumbs{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
#crumbs a{cursor:pointer;color:var(--acc2);font-weight:600;padding:2px 4px;border-radius:6px}
#crumbs a:hover{background:var(--card)}
#crumbs span{color:var(--mut)}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.pri,.ghost{padding:9px 14px;border-radius:10px;border:2px solid var(--acc);font-weight:600}
.pri{background:var(--acc);color:#1a1200}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px;perspective:1000px;padding:10px 8px 30px}
.tile{position:relative;min-height:158px;padding:16px 10px 12px;text-align:center;cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:12px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,box-shadow .15s;box-shadow:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge),5px 5px 0 var(--edge),6px 6px 0 var(--edge),9px 12px 18px rgba(0,0,0,.28)}
.tile:hover,.tile:focus-visible{outline:none;border-color:var(--acc2);box-shadow:1px 1px 0 var(--acc2),2px 2px 0 var(--acc2),3px 3px 0 var(--acc2),4px 4px 0 var(--acc2),5px 5px 0 var(--acc2),6px 6px 0 var(--acc2),12px 16px 24px rgba(0,0,0,.35)}
.ico svg{width:74px;height:74px;filter:drop-shadow(3px 4px 3px rgba(0,0,0,.3))}
.f1{fill:var(--fold2)}.f2{fill:var(--fold)}.p1{fill:#fff;stroke:var(--line);stroke-width:2}.p2{fill:#cfd8e3}.p3{fill:#d62828}
.nm{font-weight:600;font-size:14px;margin-top:6px;word-break:break-word}
.meta{font-size:12px;color:var(--mut);margin-top:2px}
.act{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.tile:hover .act,.tile:focus-within .act{opacity:1}
@media (hover:none){.act{opacity:1}}
.act button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;width:28px;height:28px;font-size:13px;padding:0}
.act button:hover{background:var(--acc);color:#1a1200}
#empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:16px}
#modal{position:fixed;inset:0;display:none;z-index:10;background:rgba(3,10,20,.7)}
#modal.on{display:grid;place-items:center;padding:16px}
.card{width:min(420px,100%);background:var(--card);border:2px solid var(--acc2);border-radius:14px;padding:18px;box-shadow:8px 8px 0 var(--edge)}
.card h3{margin:0 0 12px;font-size:17px;word-break:break-word}
.card input,.card select{width:100%;padding:10px;border-radius:9px;border:2px solid var(--line);background:var(--bg1);color:var(--ink);font-size:15px}
.mut{color:var(--mut);margin:0}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg1);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
h1{font-size:30px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
header{border-bottom:2px solid var(--acc2);box-shadow:0 10px 22px -16px var(--acc2)}
#q:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc2) 30%,transparent)}
.pri{box-shadow:0 4px 0 #8a5200;transition:transform .08s,box-shadow .08s}.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5200}
.gear{position:fixed;color:var(--line);opacity:.4;z-index:0;pointer-events:none;animation:spin2 60s linear infinite}
.g1{width:360px;right:-100px;top:-90px}.g2{width:230px;left:-80px;bottom:16vh;animation-duration:38s;animation-direction:reverse}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(26px) rotateX(40deg)}}
.tile{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);background-color:var(--card);background-image:radial-gradient(circle at 9px 9px,var(--line) 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 9px) 9px,var(--line) 2.5px,transparent 3px),radial-gradient(circle at 9px calc(100% - 9px),var(--line) 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--line) 2.5px,transparent 3px),linear-gradient(180deg,color-mix(in srgb,var(--acc2) 10%,transparent),transparent 55%)}
.ico svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .ico svg{transform:translateY(-7px) scale(1.14) rotate(-4deg)}
@media (prefers-reduced-motion:reduce){.gear,.tile{animation:none}}
</style></head><body>
<div class="floor"></div>
<svg class="gear g1" viewBox="-60 -60 120 120"><g fill="none" stroke="currentColor"><circle r="44" stroke-width="12" stroke-dasharray="7.2 4.32"/><circle r="36" stroke-width="6"/><circle r="10" stroke-width="5"/><path d="M0-36V-10M0 10V36M-36 0H-10M10 0H36" stroke-width="5"/></g></svg>
<svg class="gear g2" viewBox="-60 -60 120 120"><g fill="none" stroke="currentColor"><circle r="44" stroke-width="12" stroke-dasharray="7.2 4.32"/><circle r="36" stroke-width="6"/><circle r="10" stroke-width="5"/><path d="M0-36V-10M0 10V36M-36 0H-10M10 0H36" stroke-width="5"/></g></svg>
<main>
<header>
 <div class="scene"><div class="cube"><i>⚙</i><i>π</i><i>Σ</i><i>Ω</i><i>△</i><i>∞</i></div></div>
 <div><h1>ECU Engineering Files</h1><div class="sub">Faculty of Engineering &amp; Technology · 2026/27 · Lectures &amp; Sections</div></div>
 <div class="sp"></div>
 <input id="q" type="search" placeholder="Search all files…" aria-label="Search">
</header>
<div class="bar">
 <div id="crumbs"></div>
 <span class="badge" id="mode">Online</span>
 <div class="tools">
   <button class="ghost" id="nf">＋ New folder</button>
   <button class="pri" id="up">⬆ Upload PDFs</button>
   <input type="file" id="file" accept="application/pdf,.pdf" multiple style="display:none">
 </div>
</div>
<div class="grid" id="grid"></div>
<div id="empty">Loading…</div>
</main>
<div id="modal"></div>
<div id="toast"></div>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAM-_77X4GrRD9rBAzUJux0b_povExyajs",
    authDomain: "ecu-1f047.firebaseapp.com",
    projectId: "ecu-1f047",
    storageBucket: "ecu-1f047.firebasestorage.app",
    messagingSenderId: "1209999977",
    appId: "1:1209999977:web:be5065b34a4a6d851a78f8",
    measurementId: "G-EGE0KV961M"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FOLD='<svg viewBox="0 0 64 64"><path class="f1" d="M4 14a4 4 0 0 1 4-4h16l6 7h26a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path class="f2" d="M4 26a4 4 0 0 1 4-4h48a4 4 0 0 1 4 4v23a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/></svg>';
const FILE='<svg viewBox="0 0 64 64"><path class="p1" d="M14 4h26l12 12v40a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/><path class="p2" d="M40 4l12 12h-8a4 4 0 0 1-4-4z"/><rect class="p3" x="16" y="34" width="32" height="15" rx="3"/><text x="32" y="45.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Arial">PDF</text></svg>';
const PAL=[["#ffd24a","#e8a200","#b97d00"],["#5ee0ff","#1aa6d6","#0b7aa3"],["#ff7ab8","#e0398a","#a8206a"],["#8bf06b","#4cc23a","#2f8f27"],["#b69cff","#7f5af0","#5a3cc4"],["#ff9a5c","#ee6a22","#b94a12"]];
const GL=["⚙\uFE0E","Ω","π","∞","⚡\uFE0E","∫"];
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function fIco(n){const h=hash(n.name),p=PAL[h%PAL.length];const g=/lec/i.test(n.name)?"Σ":/sec|tut/i.test(n.name)?"△":/lab/i.test(n.name)?"◈":GL[(h>>>3)%GL.length];
return `<svg viewBox="0 0 64 64"><polygon points="32,5 57,19 32,33 7,19" fill="${p[0]}"/><polygon points="7,19 32,33 32,59 7,45" fill="${p[1]}"/><polygon points="57,19 32,33 32,59 57,45" fill="${p[2]}"/><path d="M7 19L32 33L57 19M32 33V59" stroke="#fff" stroke-opacity=".55" fill="none" stroke-width="1.5"/><circle cx="32" cy="33" r="11" fill="#0b1c30" stroke="#fff" stroke-width="2"/><text x="32" y="38.5" text-anchor="middle" font-size="15" font-weight="700" fill="${p[0]}" font-family="Arial,sans-serif">${g}</text></svg>`}
const CHIP=`<svg viewBox="0 0 64 64"><g stroke="#5ee0ff" stroke-width="3" stroke-linecap="round">`+[16,26,38,48].map(v=>`<path d="M${v} 6V14M${v} 50V58M6 ${v}H14M50 ${v}H58"/>`).join("")+`</g><rect x="13" y="13" width="38" height="38" rx="7" fill="#0b1c30" stroke="#5ee0ff" stroke-width="2.5"/><rect x="19" y="19" width="26" height="26" rx="4" fill="none" stroke="#1aa6d6" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="19" cy="19" r="1.8" fill="#ff5a5a"/><text x="32" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Arial,sans-serif">PDF</text></svg>`;
let nodes=[],cur="root",q="",msg="Loading…";
const byId=id=>nodes.find(n=>n.id===id);
const kids=id=>nodes.filter(n=>n.parent===id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const col=()=>db.collection("nodes");
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
function pathOf(id){const p=[];let n=byId(id);while(n){p.unshift(n);n=byId(n.parent)}return p}
function descendants(id){return kids(id).flatMap(k=>[k,...(k.type==="folder"?descendants(k.id):[])])}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)}
function modal(title,body,ok){return new Promise(res=>{const m=$("#modal");m.innerHTML=`<div class="card"><h3>${esc(title)}</h3>${body}<div class="row"><button class="ghost" id="mx">Cancel</button><button class="pri" id="mo">${ok||"OK"}</button></div></div>`;m.classList.add("on");const inp=m.querySelector("input,select");const done=v=>{const val=inp?inp.value:"";m.classList.remove("on");m.innerHTML="";res(v?{v:val}:null)};$("#mx").onclick=()=>done(false);$("#mo").onclick=()=>done(true);m.onclick=e=>{if(e.target===m)done(false)};if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")done(true)}}})}
async function ask(title,val){const r=await modal(title,`<input value="${esc(val||"")}" maxlength="120">`,"Save");const v=r&&r.v.trim();return v||null}
async function run(f){try{await f()}catch(e){toast((e&&e.message)||"Something went wrong")}}
async function newFolder(){const n=await ask("New folder","");if(n)run(()=>col().doc(uid()).set({name:n,type:"folder",parent:cur,t:Date.now()}))}
async function upload(files){
 const list=[...files].filter(f=>f.type==="application/pdf"||/\.pdf$/i.test(f.name));
 if(!list.length){toast("Choose PDF files");return}
 let i=0;
 for(const f of list){toast(`Uploading ${++i}/${list.length}…`);
  try{
    const fileId=uid();
    const storageRef=storage.ref().child("pdfs/"+fileId+"_"+f.name);
    const snapshot=await storageRef.put(f);
    const downloadURL=await snapshot.ref.getDownloadURL();
    await col().doc(fileId).set({name:f.name.replace(/\.pdf$/i,""),type:"file",parent:cur,url:downloadURL,size:f.size,t:Date.now()});
  }
  catch(e){toast(f.name+": "+((e&&e.message)||"failed"));return}}
 toast("Done ✓")}
async function rename(n){const v=await ask("Rename",n.name);if(v&&v!==n.name)run(()=>col().doc(n.id).update({name:v}))}
async function move(n){
 const bad=new Set([n.id,...(n.type==="folder"?descendants(n.id).map(x=>x.id):[])]);
 const fs=nodes.filter(x=>x.type==="folder"&&!bad.has(x.id)).map(x=>({id:x.id,p:pathOf(x.id).map(y=>y.name).join(" / ")})).sort((a,b)=>a.p.localeCompare(b.p,undefined,{numeric:true}));
 const opts=`<option value="root"${n.parent==="root"?" selected":""}>🏠 Home</option>`+fs.map(x=>`<option value="${x.id}"${x.id===n.parent?" selected":""}>${esc(x.p)}</option>`).join("");
 const r=await modal("Move “"+n.name+"” to",`<select>${opts}</select>`,"Move");
 if(r&&r.v!==n.parent)run(()=>col().doc(n.id).update({parent:r.v}))}
async function del(n){
 const d=n.type==="folder"?descendants(n.id):[];
 const r=await modal("Delete “"+n.name+"”?",`<p class="mut">${n.type==="folder"?"This also deletes "+d.length+" item(s) inside it.":"This can't be undone."}</p>`,"Delete");
 if(!r)return;
 run(async()=>{for(const x of [n,...d]){if(x.url){try{const ref=storage.refFromURL(x.url);await ref.delete()}catch(e){}}await col().doc(x.id).delete()}toast("Deleted")})}
function view(n){window.open(n.url,"_blank");}
function go(id){cur=id;q="";$("#q").value="";render();scrollTo(0,0)}
function render(){
 if(cur!=="root"&&!byId(cur)&&nodes.length)cur="root";
 const list=(q?nodes.filter(n=>n.name.toLowerCase().includes(q)):kids(cur)).slice();
 list.sort((a,b)=>(a.type===b.type?0:a.type==="folder"?-1:1)||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
 const cr=pathOf(cur);
 $("#crumbs").innerHTML=`<a data-go="root">🏠 Home</a>`+cr.map(n=>`<span>/</span><a data-go="${n.id}">${esc(n.name)}</a>`).join("");
 $("#grid").innerHTML=list.map((n,i)=>{
  const f=n.type==="folder",c=f?kids(n.id).length:0;
  const sub=f?c+" item"+(c===1?"":"s"):fmt(n.size||0)+" · PDF";
  const where=q?pathOf(n.parent).map(x=>x.name).join(" / "):"";
  return `<div class="tile" tabindex="0" data-id="${n.id}" style="--i:${Math.min(i,12)}"><div class="act"><button data-a="r" title="Rename">✎</button><button data-a="m" title="Move">⇄</button><button data-a="d" title="Delete">🗑</button></div><div class="ico">${f?fIco(n):CHIP}</div><div class="nm">${esc(n.name)}</div><div class="meta">${sub}</div>${where?`<div class="meta">${esc(where)}</div>`:""}</div>`}).join("");
 $("#empty").hidden=list.length>0;
 $("#empty").textContent=msg?msg:q?"No results.":"This folder is empty. Add a folder or upload PDFs."}
$("#grid").onclick=e=>{
 const t=e.target.closest(".tile");if(!t)return;const n=byId(t.dataset.id);if(!n)return;
 const a=e.target.closest("[data-a]");
 if(a){({r:rename,m:move,d:del})[a.dataset.a](n);return}
 if(n.type==="folder")go(n.id);else view(n)};
$("#grid").onkeydown=e=>{if(e.key==="Enter"&&e.target.classList.contains("tile"))e.target.click()};
$("#grid").onpointermove=e=>{const t=e.target.closest(".tile");if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*16+"deg");t.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*16+"deg")};
$("#grid").onpointerout=e=>{const t=e.target.closest(".tile");if(t){t.style.removeProperty("--rx");t.style.removeProperty("--ry")}};
$("#crumbs").onclick=e=>{const a=e.target.closest("[data-go]");if(a)go(a.dataset.go)};
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$("#nf").onclick=newFolder;
$("#up").onclick=()=>$("#file").click();
$("#file").onchange=e=>{upload(e.target.files);e.target.value=""};
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();upload(e.dataTransfer.files)});

col().onSnapshot(s=>{
  nodes=s.docs.map(d=>({id:d.id,...d.data()}));
  msg="";
  render();
},e=>{
  msg="Couldn't load files: "+e.message;
  render();
});
</script>
</body></html>
